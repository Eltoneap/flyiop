name: Monitor diário de passagens

on:
  schedule:
    # 2x/dia (decisão de 03/08/2026): restaurado após rodada limpa de 1x/dia.
    # Janela de 14h BRT avaliada e descartada — 3x geraria recheque duplicado
    # de parte da fila; 2x já cobre quase toda ela (~43 pernas elegíveis,
    # 40 slots em 2x). Ver STATE.md.
    - cron: "0 11 * * *"   # 08:00 BRT
    - cron: "0 23 * * *"   # 20:00 BRT
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/main.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
