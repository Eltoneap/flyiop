name: Monitor diário de passagens

on:
  schedule:
    # Temporariamente só 1x/dia (decisão de 29/07/2026): primeira execução
    # em produção de Parte 9/10/Etapa 3 desde o push que os introduziu.
    # As janelas de 14h/20h BRT do escalonamento automático (Parte 10,
    # scrape_schedule.py) voltam manualmente depois de confirmar que esta
    # rodada passou limpa — ver STATE.md.
    - cron: "0 11 * * *"   # 08:00 BRT
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/main.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
